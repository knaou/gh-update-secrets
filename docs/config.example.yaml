# gh-secret-sync 設定ファイルサンプル
#
# このファイルは gh-secret-sync の設定例（平文）です。
# 実際に運用する際は SOPS 等で暗号化してご使用ください。

# 1. 設定値の定義
secrets:
  GLOBAL_API_KEY: "sk_live_example_key_123456789"
  DATADOG_API_KEY: "dd_api_key_abcdef123456"

vars:
  LOG_LEVEL: "info"
  APP_ENV: "production"

envs:
  - name: production
    secrets:
      DATABASE_URL: "postgres://prod_user:secure_prod_pass@prod-db.internal:5432/prod_db"
      REDIS_URL: "redis://prod-redis.internal:6379"
    vars:
      API_ENDPOINT: "https://api.example.com"

  - name: staging
    secrets:
      DATABASE_URL: "postgres://stage_user:secure_stage_pass@stage-db.internal:5432/stage_db"
      REDIS_URL: "redis://stage-redis.internal:6379"
    vars:
      API_ENDPOINT: "https://staging-api.example.com"

# 2. リポジトリごとの適用設定
#    - 文字列指定: 全設定を適用 (後方互換)
#    - オブジェクト指定: include に列挙した名前のみ適用 (省略時は何も適用しない)
repos:
  # 全設定を適用 (従来の書式と同じ)
  - my-org/service-a

  # GLOBAL_API_KEY, LOG_LEVEL, production 環境のみ適用
  - repo: my-org/service-b
    include:
      - GLOBAL_API_KEY
      - LOG_LEVEL
      - production
